name: by_hex
description: "تطبيق محرر Hex متعدد المنصات."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  firebase_storage: ^11.5.6
  cloud_firestore: ^4.13.6
  
  # State Management
  provider: ^6.1.1
  
  # UI Components
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  
  # File Handling
  file_picker: ^6.1.1
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  
  # Hex Editing
  hex: ^0.2.0
  binary: ^3.0.1
  
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  logger: ^2.0.2+1
  http: ^1.1.0
  crypto: ^3.0.3
  
  # WhatsApp Integration
  receive_sharing_intent: ^1.6.7
  flutter_local_notifications: ^16.1.0
  device_info_plus: ^9.1.1
  android_intent_plus: ^4.0.3
  path: ^1.8.3
  mime: ^1.0.4
  
  # Desktop Support
  window_size:
    git:
      url: https://github.com/google/flutter-desktop-embedding.git
      path: plugins/window_size
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icon/
